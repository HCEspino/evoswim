<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>evoswim</title>
    <style>
      :root { --paper: #f6f6f3; --ink: #1b1d1f; --ink-2: #6b6e72; --rule: #d4d4ce; --accent: #c43c2c; --mono: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper: #141516; --ink: #e9e7e2; --ink-2: #8d8b86; --rule: #2d2f31; --accent: #e2543f; } }
      :root[data-theme="dark"] { --paper: #141516; --ink: #e9e7e2; --ink-2: #8d8b86; --rule: #2d2f31; --accent: #e2543f; }
      html, body { margin: 0; background: var(--paper); color: var(--ink); }
      body { font: 13px/1.45 var(--mono); }
      .bar { display: flex; gap: 20px; align-items: baseline; padding: 10px 16px; border-bottom: 1px solid var(--rule); }
      .muted { color: var(--ink-2); }
      button { font: inherit; color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: .18em; }
      button:hover { text-decoration-color: var(--accent); }
      .spacer { flex: 1; }
      main { display: flex; flex-direction: column; gap: 16px; padding: 16px; }
      canvas#tank { display: block; width: 100%; aspect-ratio: 16 / 9; max-height: calc(100vh - 110px); border: 1px solid var(--rule); border-radius: 2px; }
      .panel { display: grid; grid-template-columns: 18ch minmax(0, 1fr) minmax(0, 1.1fr); gap: 28px; align-items: start; min-width: 0; }
      canvas#closeup { display: block; width: 100%; aspect-ratio: 21 / 9; border: 1px solid var(--rule); border-radius: 2px; }
      canvas#closeup[hidden] { display: none; }
      .panel > .col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
      .panel dl { display: grid; grid-template-columns: 8ch 1fr; row-gap: 4px; column-gap: 12px; margin: 0; }
      .panel dt { color: var(--ink-2); }
      .panel dd { margin: 0; }
      .panel pre { margin: 0; white-space: pre; overflow-x: auto; font: inherit; font-size: 12px; line-height: 1.5; color: var(--ink); }
      .panel h2 { font: inherit; font-weight: 600; margin: 0; }
      .lineage { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
      .mini canvas { display: block; width: 100%; aspect-ratio: 16 / 10; border: 1px solid var(--rule); border-radius: 2px; }
      .mini-now canvas { border-color: var(--accent); }
      .mini-cap { font-size: 11px; color: var(--ink-2); margin-top: 3px; }
      .empty { color: var(--ink-2); }
      @media (max-width: 900px) { .panel { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div class="bar">
      <span class="muted" id="arch"></span>
      <span class="spacer"></span>
      <button id="theme">theme</button>
    </div>
    <main>
      <canvas id="tank" aria-label="a tank of evolved swimmers"></canvas>
      <canvas id="closeup" hidden aria-label="close-up of the chosen swimmer"></canvas>
      <section class="panel" id="panel">
        <div class="col">
          <div class="empty" id="empty">Nothing under the glass yet.</div>
          <dl id="lines" hidden></dl>
        </div>
        <div class="col">
          <h2 id="h-move" hidden>Movement</h2>
          <pre id="formula" hidden></pre>
        </div>
        <div class="col">
          <h2 id="h-lin" hidden>Lineage</h2>
          <div class="lineage" id="lineage"></div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
